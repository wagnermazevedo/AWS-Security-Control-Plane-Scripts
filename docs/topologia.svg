<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="1100" height="650" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>AWS Security Control Plane: como todo módulo funciona</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e9e62"/></marker></defs>
<rect x="0" y="0" width="1100" height="650" rx="16" fill="#ffffff"/>
<text x="32" y="44" font-size="22" font-weight="700" fill="#111827">AWS Security Control Plane: como todo módulo funciona</text>
<text x="32" y="70" font-size="14" fill="#4b5563">O mesmo contrato, o mesmo orquestrador e as mesmas saídas em todos os episódios da série</text>
<rect x="32" y="96" width="1036" height="90" rx="10" fill="#f4f0fd" stroke="#7b5cd6" stroke-width="1.6"/>
<text x="46" y="120" font-size="14.5" font-weight="700" fill="#3d2a7a">test-control-plane.sh  ·  o orquestrador</text>
<text x="46" y="142" font-size="12" fill="#374151" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">list-repos   ·   scan-all   ·   &lt;repo&gt; dry-run | apply   ·   scan | plan | remediate-dry-run | remediate-apply</text>
<text x="46" y="160" font-size="12.5" fill="#374151">Encontra os estágios 00, 01 e 02 de cada módulo e mascara números de conta e e-mails entre uma etapa e outra</text>
<path d="M412,186 L412,226" fill="none" stroke="#4b5563" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="454.5" y="199" width="131.0" height="18" rx="4" fill="#ffffff" fill-opacity="0.92"/>
<text x="520" y="212" font-size="12" fill="#3d2a7a" text-anchor="middle">roda 00 → 01 → 02</text>
<rect x="32" y="226" width="772" height="232" rx="14" fill="#eef4ff" fill-opacity="0.45" stroke="#3b6fd8" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="48" y="250" font-size="13" font-weight="700" fill="#1e3a7a" letter-spacing="0.4">MÓDULO DA SÉRIE  ·  AWS-&lt;Domínio&gt;-as-Control-Plane</text>
<rect x="52" y="262" width="160" height="92" rx="10" fill="#fff6e5" stroke="#d18a14" stroke-width="1.6"/>
<text x="66" y="286" font-size="14.5" font-weight="700" fill="#6b4405">99 · Laboratório</text>
<text x="66" y="308" font-size="12.5" fill="#374151">monta o cenário inseguro</text>
<text x="66" y="326" font-size="12.5" fill="#374151">--destroy desfaz tudo</text>
<rect x="248" y="262" width="160" height="92" rx="10" fill="#eef4ff" stroke="#3b6fd8" stroke-width="1.6"/>
<text x="262" y="286" font-size="14.5" font-weight="700" fill="#1e3a7a">00 · Scan</text>
<rect x="355" y="271" width="43" height="20" rx="10" fill="#3b6fd8"/>
<text x="376.5" y="285" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">SÓ LÊ</text>
<text x="262" y="308" font-size="12.5" fill="#374151">lê o ambiente</text>
<text x="262" y="326" font-size="12.5" fill="#374151">nunca altera nada</text>
<rect x="444" y="262" width="160" height="92" rx="10" fill="#e9f7f8" stroke="#2a9aa6" stroke-width="1.6"/>
<text x="458" y="286" font-size="14.5" font-weight="700" fill="#114e55">01 · Plan</text>
<rect x="544" y="271" width="50" height="20" rx="10" fill="#2a9aa6"/>
<text x="569.0" y="285" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">DECIDE</text>
<text x="458" y="308" font-size="12.5" fill="#374151">decide o destino</text>
<text x="458" y="326" font-size="12.5" fill="#374151">de cada item</text>
<rect x="640" y="262" width="160" height="92" rx="10" fill="#ecf8f1" stroke="#2e9e62" stroke-width="1.6"/>
<text x="654" y="286" font-size="14.5" font-weight="700" fill="#145233">02 · Remediate</text>
<text x="654" y="308" font-size="12.5" fill="#374151">dry-run por padrão</text>
<text x="654" y="326" font-size="12.5" fill="#374151">apply corrige</text>
<path d="M408,308 L444,308" fill="none" stroke="#4b5563" stroke-width="1.8" marker-end="url(#ah)"/>
<path d="M604,308 L640,308" fill="none" stroke="#4b5563" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="426" y="300" font-size="11" fill="#4b5563" text-anchor="middle">YAML</text>
<text x="622" y="300" font-size="11" fill="#4b5563" text-anchor="middle">plano</text>
<rect x="444" y="384" width="160" height="56" rx="10" fill="#e9f7f8" stroke="#2a9aa6" stroke-width="1.6"/>
<text x="458" y="408" font-size="14.5" font-weight="700" fill="#114e55">config/</text>
<text x="458" y="430" font-size="12.5" fill="#374151">mapa de regras</text>
<path d="M524,384 L524,356" fill="none" stroke="#4b5563" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="836" y="262" width="232" height="196" rx="10" fill="#f3f4f6" stroke="#8b93a1" stroke-width="1.6"/>
<text x="850" y="286" font-size="14.5" font-weight="700" fill="#2f3542">outputs/&lt;timestamp&gt;/</text>
<text x="850" y="308" font-size="12.5" fill="#374151">Uma pasta nova por execução,</text>
<text x="850" y="326" font-size="12.5" fill="#374151">nunca sobrescrita:</text>
<text x="850" y="344" font-size="12.5" fill="#374151"></text>
<text x="850" y="362" font-size="12.5" fill="#374151">YAML  · entrada da próxima etapa</text>
<text x="850" y="380" font-size="12.5" fill="#374151">JSON  · fonte da verdade</text>
<text x="850" y="398" font-size="12.5" fill="#374151">CSV   · Amazon Athena</text>
<text x="850" y="416" font-size="12.5" fill="#374151">MD    · resumo para leitura</text>
<path d="M800,308 L836,308" fill="none" stroke="#4b5563" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="32" y="500" width="1036" height="96" rx="14" fill="#f3f4f6" fill-opacity="0.45" stroke="#8b93a1" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="48" y="524" font-size="13" font-weight="700" fill="#2f3542" letter-spacing="0.4">CONTA OU ORGANIZAÇÃO AWS DE TESTES</text>
<text x="52" y="552" font-size="12.5" fill="#374151" text-anchor="start">lab_insecure/ cria os problemas de propósito  ·  o scan só usa APIs de leitura  ·  APIs de escrita só no apply</text>
<text x="52" y="576" font-size="12.5" fill="#4b5563" text-anchor="start">Mesma conta no CloudShell: o orquestrador roda a partir do $HOME, com todos os módulos clonados lado a lado</text>
<path d="M132,354 L132,500" fill="none" stroke="#d18a14" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="91.0" y="467" width="82.0" height="18" rx="4" fill="#ffffff" fill-opacity="0.92"/>
<text x="132" y="480" font-size="12" fill="#6b4405" text-anchor="middle">cria o lab</text>
<path d="M328,500 L328,356" fill="none" stroke="#3b6fd8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="315.0" y="467" width="26.0" height="18" rx="4" fill="#ffffff" fill-opacity="0.92"/>
<text x="328" y="480" font-size="12" fill="#1e3a7a" text-anchor="middle">lê</text>
<path d="M720,354 L720,500" fill="none" stroke="#2e9e62" stroke-width="1.8" marker-end="url(#ahg)"/>
<rect x="661.5" y="467" width="117.0" height="18" rx="4" fill="#ffffff" fill-opacity="0.92"/>
<text x="720" y="480" font-size="12" fill="#145233" text-anchor="middle">corrige (apply)</text>
<text x="550" y="628" font-size="12.5" fill="#7a1f1a" text-anchor="middle" font-weight="700">⚠ Sempre numa conta de testes: os laboratórios criam problemas de propósito.</text>
</svg>